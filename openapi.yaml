openapi: 3.0.3
info:
  title: Transport API
  description: |
    Production-ready REST API for public transport data in **Dakar, Senegal**.

    Part of the **Dakar Mobility** platform, this API provides transport networks, routes, stations, and itinerary planning.

    The Dakar Mobility web application combines:
    - **Transport API** → transport network data (this API)
    - **Frontières API** → administrative geography (regions, communes, localities)

    ## Transport Systems
    - Dakar Bus Rapid Transit (BRT)
    - Dakar Regional Express Train (TER)
    - Dakar Dem Dikk (DDD)
    - AFTU Tata buses
    - Car Rapide
    - Ndiaga Ndiaye

    ## Response Formats
    All endpoints return JSON. The `/api/map/stations` endpoint returns GeoJSON.
  version: 1.0.0
  contact:
    name: Dakar Mobility
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Health
    description: API health check
  - name: Transport Types
    description: Public transport systems in Dakar
  - name: Stations
    description: Transport stations and stops
  - name: Routes
    description: Transport routes and travel times
  - name: Itinerary
    description: Route planning and itinerary computation

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns the health status of the API.
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: Transport API
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time
                    example: "2025-01-15T10:30:00.000Z"

  /api/transport-types:
    get:
      tags: [Transport Types]
      summary: List all transport types
      description: Returns all public transport systems operating in Dakar.
      responses:
        '200':
          description: List of transport types
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 6
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransportType'
              example:
                success: true
                count: 6
                data:
                  - id: 1
                    name: "Dakar Bus Rapid Transit"
                    description: "Bus Rapid Transit system operating dedicated lanes across Dakar metropolitan area."
                  - id: 2
                    name: "Dakar Regional Express Train"
                    description: "Regional express rail service (TER) connecting Dakar to Diamniadio and AIBD."

  /api/stations:
    get:
      tags: [Stations]
      summary: List stations
      description: Returns a paginated list of transport stations. Optionally filter by transport type.
      parameters:
        - name: transport_type_id
          in: query
          schema:
            type: integer
          description: Filter by transport type ID
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip
      responses:
        '200':
          description: List of stations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Station'
              example:
                success: true
                count: 5
                data:
                  - id: 1
                    name: "Gare de Guédiawaye"
                    lat: 14.7645
                    lon: -17.3934
                    transport_type_id: 1
                    transport_type_name: "Dakar Bus Rapid Transit"

  /api/stations/{id}:
    get:
      tags: [Stations]
      summary: Get station by ID
      description: Returns a single station by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Station ID
      responses:
        '200':
          description: Station details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Station'
              example:
                success: true
                data:
                  id: 1
                  name: "Gare de Guédiawaye"
                  lat: 14.7645
                  lon: -17.3934
                  transport_type_id: 1
                  transport_type_name: "Dakar Bus Rapid Transit"
        '404':
          description: Station not found
          content:
            application/json:
              example:
                success: false
                error: "Station not found"

  /api/map/stations:
    get:
      tags: [Stations]
      summary: Get stations as GeoJSON
      description: Returns all stations as a GeoJSON FeatureCollection for map rendering.
      parameters:
        - name: transport_type_id
          in: query
          schema:
            type: integer
          description: Filter by transport type ID
      responses:
        '200':
          description: GeoJSON FeatureCollection of stations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJSONFeatureCollection'
              example:
                type: FeatureCollection
                features:
                  - type: Feature
                    geometry:
                      type: Point
                      coordinates: [-17.3934, 14.7645]
                    properties:
                      id: 1
                      name: "Gare de Guédiawaye"
                      transport_type_id: 1
                      transport_type_name: "Dakar Bus Rapid Transit"

  /api/routes:
    get:
      tags: [Routes]
      summary: List routes
      description: Returns all transport routes. Optionally filter by transport type.
      parameters:
        - name: transport_type_id
          in: query
          schema:
            type: integer
          description: Filter by transport type ID
      responses:
        '200':
          description: List of routes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Route'
              example:
                success: true
                count: 3
                data:
                  - id: 1
                    name: "BRT Ligne 1 — Guédiawaye / Gare de Dakar"
                    transport_type_id: 1
                    transport_type_name: "Dakar Bus Rapid Transit"

  /api/routes/{id}:
    get:
      tags: [Routes]
      summary: Get route by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Route details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Route'
              example:
                success: true
                data:
                  id: 1
                  name: "BRT Ligne 1 — Guédiawaye / Gare de Dakar"
                  transport_type_id: 1
                  transport_type_name: "Dakar Bus Rapid Transit"
        '404':
          description: Route not found
          content:
            application/json:
              example:
                success: false
                error: "Route not found"

  /api/routes/{id}/stations:
    get:
      tags: [Routes]
      summary: Get stations for a route
      description: Returns ordered list of stations along a route.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Route stations in order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  route:
                    $ref: '#/components/schemas/Route'
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RouteStation'
              example:
                success: true
                route:
                  id: 1
                  name: "BRT Ligne 1 — Guédiawaye / Gare de Dakar"
                  transport_type_id: 1
                  transport_type_name: "Dakar Bus Rapid Transit"
                count: 5
                data:
                  - station_order: 1
                    id: 1
                    name: "Gare de Guédiawaye"
                    lat: 14.7645
                    lon: -17.3934
        '404':
          description: Route not found

  /api/travel-time:
    get:
      tags: [Routes]
      summary: Get travel time between two stations
      description: Returns the average travel time between two stations on a specific route.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: integer
          description: Origin station ID
        - name: to
          in: query
          required: true
          schema:
            type: integer
          description: Destination station ID
        - name: route
          in: query
          required: true
          schema:
            type: integer
          description: Route ID
      responses:
        '200':
          description: Travel time data
          content:
            application/json:
              example:
                success: true
                data:
                  id: 1
                  route_id: 1
                  from_station_id: 1
                  to_station_id: 2
                  avg_minutes: 8
        '400':
          description: Missing required parameters
          content:
            application/json:
              example:
                success: false
                error: "Missing required parameters: from, to, route"
        '404':
          description: Travel time not found

  /api/itinerary:
    get:
      tags: [Itinerary]
      summary: Compute itinerary
      description: |
        Computes an itinerary between two geographic points using Dakar's public transport network.

        The routing engine:
        1. Finds nearest stations to origin and destination using PostGIS spatial queries
        2. Searches for direct routes between stations
        3. Attempts single-transfer routes if no direct route exists
        4. Returns up to 3 itinerary options sorted by total travel time

        **Note:** The destination locality can come from the Frontières API, which the Dakar Mobility frontend queries separately.
      parameters:
        - name: origin_lat
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Origin latitude
          example: 14.7645
        - name: origin_lon
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Origin longitude
          example: -17.3934
        - name: destination_lat
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Destination latitude
          example: 14.6820
        - name: destination_lon
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Destination longitude
          example: -17.4410
      responses:
        '200':
          description: Itinerary computed successfully
          content:
            application/json:
              example:
                success: true
                data:
                  origin:
                    lat: 14.7645
                    lon: -17.3934
                  destination:
                    lat: 14.6820
                    lon: -17.4410
                  itineraries:
                    - type: direct
                      total_minutes: 41.5
                      steps:
                        - action: walk
                          from: origin
                          to: "Gare de Guédiawaye"
                          station_id: 1
                          duration_minutes: 0.5
                          distance_km: 0.038
                        - action: ride
                          transport: "Dakar Bus Rapid Transit"
                          route: "BRT Ligne 1 — Guédiawaye / Gare de Dakar"
                          route_id: 1
                          from: "Gare de Guédiawaye"
                          from_station_id: 1
                          to: "Gare de Dakar"
                          to_station_id: 5
                          duration_minutes: 41
                        - action: walk
                          from: "Gare de Dakar"
                          to: destination
                          station_id: 5
                          duration_minutes: 0.0
                          distance_km: 0.0
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              example:
                success: false
                error: "Missing required parameters: origin_lat, origin_lon, destination_lat, destination_lon"
        '404':
          description: No route found
          content:
            application/json:
              example:
                success: false
                error: "No route found between the given locations."

components:
  schemas:
    TransportType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string

    Station:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        transport_type_id:
          type: integer
        transport_type_name:
          type: string

    Route:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        transport_type_id:
          type: integer
        transport_type_name:
          type: string

    RouteStation:
      type: object
      properties:
        station_order:
          type: integer
        id:
          type: integer
        name:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double

    TravelTime:
      type: object
      properties:
        id:
          type: integer
        route_id:
          type: integer
        from_station_id:
          type: integer
        to_station_id:
          type: integer
        avg_minutes:
          type: number

    GeoJSONFeatureCollection:
      type: object
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [Feature]
              geometry:
                type: object
                properties:
                  type:
                    type: string
                    enum: [Point]
                  coordinates:
                    type: array
                    items:
                      type: number
              properties:
                type: object
